<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DailyFive – aplikace</title>
  <meta name="description" content="DailyFive: pět nejdůležitějších zpráv dne každý večer v 18:00. Neutrálně, stručně a se zdroji.">
  <meta name="robots" content="noindex">
  <meta name="apple-itunes-app" content="app-id=6829328352">
  <link rel="canonical" href="https://dailyfive.cz/">
  <meta name="theme-color" content="#1C3D36">
  <!-- Chytrý odkaz ze sdílení (dailyfive.cz/app, u zprávy dailyfive.cz/app?z=123):
       - kdo má aplikaci, tomu iPhone stránku vůbec neotevře a rovnou spustí DailyFive (Universal Links, .well-known/apple-app-site-association),
       - ve vestavěném prohlížeči Instagramu, TikToku, Facebooku… Universal Links nefungují, proto zkusíme otevřít aplikaci
         přes dailyfive:// a když se do chvilky neotevře, pošleme do App Storu,
       - v Safari (aplikace tedy není nainstalovaná) rovnou App Store, na počítači a Androidu úvodní stránka webu. -->
  <script>
    (function () {
      var STORE = "https://apps.apple.com/cz/app/dailyfive-5-zpr%C3%A1v-dne/id6829328352";
      var ua = navigator.userAgent || "";
      var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      if (!ios) { window.location.replace("/"); return; }
      var inApp = /Instagram|FBAN|FBAV|FB_IAB|musical_ly|TikTok|Bytedance|Snapchat|Messenger|LinkedInApp|Twitter/i.test(ua);
      if (!inApp) { window.location.replace(STORE); return; }
      var z = (window.location.search.match(/[?&]z=(\d+)/) || [])[1];
      var left = false;
      document.addEventListener("visibilitychange", function () { if (document.hidden) left = true; });
      window.addEventListener("pagehide", function () { left = true; });
      window.location.href = z ? "dailyfive://zprava/" + z : "dailyfive://";
      setTimeout(function () { if (!left) window.location.replace(STORE); }, 1400);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1C3D36; color: #F3EFE3; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    a { color: #E2A24A; }
  </style>
</head>
<body>
  <p>Otevírám DailyFive…<br><a href="https://apps.apple.com/cz/app/dailyfive-5-zpr%C3%A1v-dne/id6829328352">DailyFive v App Storu</a> · <a href="/">dailyfive.cz</a></p>
</body>
</html>
